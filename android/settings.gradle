def mavenCentralMirror = 'https://maven-central.storage-download.googleapis.com/maven2'

gradle.beforeProject { project ->
    def useMavenCentralMirror = { repository ->
        if (repository.hasProperty('url') && repository.url.toString().contains('repo.maven.apache.org')) {
            repository.setUrl(mavenCentralMirror)
        }
    }

    project.buildscript.repositories.whenObjectAdded(useMavenCentralMirror)
    project.repositories.whenObjectAdded(useMavenCentralMirror)
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
